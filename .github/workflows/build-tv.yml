name: Build Quem Canta TV APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Quem Canta TV Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Signing Keystore
        run: |
          if [ -f app/keystore.base64 ]; then
            base64 -d app/keystore.base64 > app/upload-keystore.jks
          fi
          ls -lh app/*.jks || true

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APK outputs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/release/app-release.apk apks/QuemCanta_TV_v1.0.0.apk
          ls -lh apks/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quemcanta-tv-apk
          path: apks/*.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Quem Canta? TV Edition v1.0.0
          body: |
            ## 🎤 Quem Canta? · O Videokê na sua TV
            - Aplicativo oficial Android TV em tela cheia imersiva.
            - Acesso instantâneo a https://duhmendes.com.br/quemcanta/
            - Aceleração de hardware e suporte a controle remoto D-pad.
          files: apks/QuemCanta_TV_v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
